# Tech Shot — daily news scan (NO publishing).
# Runs every morning (04:00 IST), discovers + verifies news and commits
# DRAFT scripts. This workflow never builds video and never publishes —
# Muse builds reels from finished scripts each morning (scene images by
# Muse, manual build.yml workflow), and the publish workflow posts them
# on the staggered schedule (09:00 / 14:00 / 19:00 IST).
name: Daily news scan

on:
  schedule:
    - cron: "30 22 * * *"   # 22:30 UTC = 04:00 IST (next day)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan news + write draft scripts
        run: python pipeline.py scan --limit 10

      - name: Commit draft scripts
        run: |
          git config user.name "tech-shot-bot"
          git config user.email "tech-shot-bot@users.noreply.github.com"
          git add content/
          git diff --cached --quiet || git commit -m "Daily scan: draft scripts $(date -u +%Y-%m-%d)"
          git push

      # Bookkeeping only — the scan + draft commit above are the real work.
      # This step must NEVER fail the whole run: if the tracking issue
      # can't be updated, the scan results are still committed and usable.
      # (2026-11-25: this step failed every morning because the
      # "daily-scan" label had never been created in the repo, so
      # `gh issue create --label daily-scan` errored with
      # "could not add label: 'daily-scan' not found".)
      - name: Update tracking issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create daily-scan --color 0E8A16 \
            --description "Daily news scan tracking" 2>/dev/null || true
          TITLE="Daily scan — $(date -u +%Y-%m-%d)"
          BODY="Scan ran. New draft scripts are in content/$(date -u +%Y/%m/%d)/.
          Review each draft, finish the voiceover, then build + approve before anything publishes."
          NUM=$(gh issue list --label daily-scan --state open --json number --jq '.[0].number')
          if [ -z "$NUM" ]; then
            gh issue create --title "$TITLE" --body "$BODY" --label daily-scan
          else
            gh issue comment "$NUM" --body "$BODY"
          fi
