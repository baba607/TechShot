# Tech Shot — build a reel in CI (manual only).
# Triggered by a human with a reel id whose script is finished. Installs
# Kokoro (PRIMARY voice) from the user's fork, falling back to upstream
# hexgrad/kokoro if the fork fails to clone; Piper is the runtime fallback
# if Kokoro voice generation itself fails. The finished video is uploaded
# as an artifact for a human to watch — it is NOT published here.
name: Build reel

on:
  workflow_dispatch:
    inputs:
      reel_id:
        description: "Reel id (content/YYYY/MM/DD/<id>), script must be finished"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TECHSHOT_KOKORO_REPO: ${{ vars.KOKORO_REPO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps (ffmpeg + espeak for Kokoro phonemization)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Kokoro (primary voice) — fork first, upstream fallback
        run: |
          REPO="${TECHSHOT_KOKORO_REPO:-https://github.com/baba607/kokoro}"
          UPSTREAM="https://github.com/hexgrad/kokoro"
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "kokoro @ git+${REPO}.git" soundfile \
            || { echo "Fork install failed, falling back to upstream $UPSTREAM"; \
                 pip install --quiet "kokoro @ git+${UPSTREAM}.git" soundfile; }

      - name: Install Piper (fallback voice only)
        run: pip install --quiet piper-tts || echo "Piper install failed — Kokoro only"

      # edge-tts is the 2nd fallback voice (Kokoro -> edge-tts -> Piper).
      # Free, no key; needs network to Microsoft at build time (CI has it).
      # Silence trim is pure stdlib (src/trim.py) — auto-editor is NOT
      # installed: it replaced the 2nd half of every Kokoro chunk with
      # digital silence (measured 2026-11-24, the v3/v4/v5 audio bug).
      - name: Install edge-tts (fallback voice)
        run: |
          pip install --quiet edge-tts || echo "edge-tts install failed — Piper fallback only"

      - name: Build reel (voice -> video -> quality check)
        env:
          TECHSHOT_PIPER_MODEL: /tmp/hi_IN-pratham-medium.onnx
        run: python pipeline.py build "${{ inputs.reel_id }}"

      - name: Upload finished video for human review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ inputs.reel_id }}
          path: content/**/final_video.mp4
          if-no-files-found: error
          retention-days: 7

      # Host the video on a GitHub release (permanent public URL) — the
      # publish workflow fetches it from here, and Instagram needs a
      # public video URL. Artifacts expire in 7 days; releases don't.
      - name: Host video on GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="reel-${{ inputs.reel_id }}"
          MP4=$(find content -name 'final_video.mp4' | head -1)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$MP4" --clobber
          else
            gh release create "$TAG" "$MP4" \
              --title "Tech Shot reel ${{ inputs.reel_id }}" \
              --notes "Reel video (Instagram needs a public URL)."
          fi
